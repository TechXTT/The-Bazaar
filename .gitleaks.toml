# gitleaks config for The Bazaar (used by the CI secret-scan job).
# Extends the default ruleset; allowlists files that are intentionally
# placeholder/example material, never real secrets.

[extend]
useDefault = true

[allowlist]
description = "Example env files and the local-dev JWT keypair are placeholders, not real secrets (SEC-1)."
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)\.dev/jwt-dev\.pem$''',
]
# Belt-and-suspenders: ignore obvious placeholder values that pattern-match a key.
regexes = [
  '''<your-[a-z0-9-]+>''',
  '''0x\.\.\.''',
  '''xxxxx''',
]
