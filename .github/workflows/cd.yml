name: CD

# Build and publish production container images for the backend and frontend.
# Triggered on semver tags (e.g. v1.2.3) or manually. Images go to GHCR using the
# always-available GITHUB_TOKEN — no extra secrets required to publish.
#
# Deployment itself is intentionally left as a documented manual/operator step
# (see docs/DEPLOY.md) rather than wired here, so a tag push never auto-deploys to
# a live environment without a human in the loop.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/sha) to build"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: bazaar-backend
          - component: frontend
            context: bazaar-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Documented gate only — does not perform a live deploy. Promote images to the
    # target environment per docs/DEPLOY.md (the runbook). Kept here so the release
    # pipeline has an explicit, auditable deploy stage to wire up when ready.
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: |
          echo "Images published to GHCR for ${{ github.ref_name }}."
          echo "Deploy is a manual operator step — follow docs/DEPLOY.md."
          echo "Wire your platform (Railway/compose/k8s) here once the target is chosen."
