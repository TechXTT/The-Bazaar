# Base (production-shaped) compose.
#
# This file describes how the stack runs in a deployed/production-like setting:
# services are built from per-component Dockerfiles (INFRA-1, owned inside each
# submodule), no source code is bind-mounted, and dependent services are gated on
# upstream healthchecks rather than mere process start.
#
# Secrets are NOT hardcoded: POSTGRES_PASSWORD (and any other secret) is read from
# a gitignored root `.env` (see `.env.example` for the keys). Create `.env` before
# running:  cp .env.example .env  &&  edit values.
#
# For local development with hot-reload / source mounts / dev servers, layer the
# dev override on top:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# (`make local-up` does this for you.)

services:
  hardhat:
    # Expected Dockerfile: bazaar-contract/Dockerfile (INFRA-1, owned by contract repo).
    build:
      context: ./bazaar-contract
    image: bazaar-contract:latest
    command: npx hardhat node --hostname 0.0.0.0
    ports:
      - "8545:8545"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'eth_blockNumber',params:[],id:1})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  contract-deploy:
    build:
      context: ./bazaar-contract
    image: bazaar-contract:latest
    command: npx hardhat run scripts/deploy-local.ts --network docker
    depends_on:
      hardhat:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bazaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bazaar}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bazaar} -d ${POSTGRES_DB:-bazaar}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    # Expected Dockerfile: bazaar-backend/Dockerfile (INFRA-1, multi-stage Go -> distroless).
    # go.mod pins Go 1.21; the production image must build with a matching toolchain (DEP-2).
    build:
      context: ./bazaar-backend
    image: bazaar-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      contract-deploy:
        condition: service_completed_successfully
    # Secrets / non-public config come from the gitignored root .env.
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-bazaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bazaar}
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_BACKEND_URL: ${APP_BACKEND_URL:-http://localhost:8000}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      ETH_URL: ${ETH_URL:-ws://hardhat:8545}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
      JWT_DEV_KEY_FILE: /data/jwt-dev.pem
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      LOCAL_UPLOAD_DIR: uploads
      SMTP_SKIP_SEND: ${SMTP_SKIP_SEND:-true}
    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads
      - backend-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8000/health"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    # Expected Dockerfile: bazaar-frontend/Dockerfile (INFRA-1, next build -> next start on slim node).
    build:
      context: ./bazaar-frontend
    image: bazaar-frontend:latest
    command: pnpm start -- -H 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS:-0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0}
      NEXT_PUBLIC_USDC_ADDRESS: ${NEXT_PUBLIC_USDC_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-0x7a69}
      NEXT_PUBLIC_CHAIN_NAME: ${NEXT_PUBLIC_CHAIN_NAME:-Hardhat Local}
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-http://localhost:8545}
      NEXT_PUBLIC_CDN_BASE_URL: ${NEXT_PUBLIC_CDN_BASE_URL:-http://localhost:8000/api/uploads}
      NEXT_PUBLIC_ETHERSCAN_TX_BASE_URL: ${NEXT_PUBLIC_ETHERSCAN_TX_BASE_URL:-}
      NEXT_PUBLIC_ESCROW_RELEASE_DAYS: ${NEXT_PUBLIC_ESCROW_RELEASE_DAYS:-14}
      NEXT_PUBLIC_PLATFORM_FEE_BPS: ${NEXT_PUBLIC_PLATFORM_FEE_BPS:-200}
      # Set to "true" only when running the e2e suite (injected wallet). Leave unset/false otherwise.
      NEXT_PUBLIC_E2E: ${NEXT_PUBLIC_E2E:-false}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  backend-uploads:
  backend-data:
