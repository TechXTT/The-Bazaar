services:
  hardhat:
    image: node:20
    working_dir: /app
    command: sh -c "npm ci && npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"
    volumes:
      - ./bazaar-contract:/app
      - hardhat-node-modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',method:'eth_blockNumber',params:[],id:1})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  contract-deploy:
    image: node:20
    working_dir: /app
    command: sh -c "npx hardhat run scripts/deploy-local.ts --network docker"
    depends_on:
      hardhat:
        condition: service_healthy
    volumes:
      - ./bazaar-contract:/app
      - hardhat-node-modules:/app/node_modules

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bazaar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: golang:1.22
    working_dir: /app
    command: go run ./...
    depends_on:
      postgres:
        condition: service_started
      contract-deploy:
        condition: service_completed_successfully
    env_file:
      - bazaar-backend/.env.example
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: bazaar
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bazaar
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      HTTP_ALLOWED_ORIGINS: http://localhost:3000
      APP_BACKEND_URL: http://localhost:8000
      APP_FRONTEND_URL: http://localhost:3000
      ETH_URL: ws://hardhat:8545
      CONTRACT_ADDRESS: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      JWT_DEV_KEY_FILE: /data/jwt-dev.pem
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: uploads
      SMTP_SKIP_SEND: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./bazaar-backend:/app
      - backend-uploads:/app/uploads
      - backend-data:/data

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install && pnpm dev -- -H 0.0.0.0"
    depends_on:
      - backend
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_CONTRACT_ADDRESS: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      NEXT_PUBLIC_USDC_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      NEXT_PUBLIC_CHAIN_ID: "0x7a69"
      NEXT_PUBLIC_CHAIN_NAME: Hardhat Local
      NEXT_PUBLIC_RPC_URL: http://localhost:8545
      NEXT_PUBLIC_CDN_BASE_URL: http://localhost:8000/api/uploads
      NEXT_PUBLIC_ETHERSCAN_TX_BASE_URL: ""
      NEXT_PUBLIC_ESCROW_RELEASE_DAYS: "14"
    ports:
      - "3000:3000"
    volumes:
      - ./bazaar-frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  backend-uploads:
  backend-data:
  frontend-node-modules:
  hardhat-node-modules:
